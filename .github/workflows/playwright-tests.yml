name: Playwright Java Tests

on:
  push:
    branches:
      - feature/*
      - develop
  pull_request:
    branches:
      - develop
      - main

env:
  TEST_GROUP: smoke

jobs:
  playwright-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Playwright Docker image
        run: docker build -t playwright-tests .

      - name: Run Playwright tests in Docker
        run: |
          docker run \
            --name playwright-run \
            -e TEST_GROUP=${TEST_GROUP} \
            playwright-tests || true

          docker cp playwright-run:/tests/target target || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: target